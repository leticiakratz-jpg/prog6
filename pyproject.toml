[project]
name = "festa-ifc"
version = "0.1.0"
description = "Sistema de organização de uma festa no IFC Campus Blumenau"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.39.0",
    "SQLAlchemy>=2.0.32",
    "pymysql>=1.1.1",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
